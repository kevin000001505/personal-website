services:
  website:
    build: .
    container_name: frontend
    restart: unless-stopped
    depends_on:
      - fastapi
    ports:
      - "3080:80"
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  fastapi:
    build:
      context: .
      dockerfile: src/Dockerfile
    container_name: fastapi
    restart: unless-stopped
    environment:
      - AI_SERVER_API_KEY=${AI_SERVER_API_KEY}
      - AI_BASE_URL=${AI_BASE_URL}
      - LOGFIRE_TOKEN=${LOGFIRE_TOKEN}
      - NTFY_TOPIC=${NTFY_TOPIC}
      - ANALYTICS_FILE=/data/analytics.jsonl
    ports:
      - "8000:8000"
    networks:
      - app-net
    volumes:
      - analytics_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8000/health"]
      interval: 30s
      timeout: 3s
      retries: 3

  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    restart: unless-stopped          # ← ADD: auto-restart if Loki unreachable at boot
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-net                      # ← ADD: needs a network for outbound LAN traffic
    depends_on:
      - fastapi
    env_file: .env
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true

volumes:
  analytics_data:

networks:
  app-net:
    driver: bridge